<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="1000" height="600" fill="#ffffff"/>

  <text x="30" y="32" font-size="16" font-weight="bold" fill="#111827">图5-2 TSN时间感知调度与报文抢占时序</text>

  <!-- 左侧三条优先级队列 -->
  <text x="30" y="66" font-size="13" font-weight="bold" fill="#111827">优先级队列（交换机出口）</text>
  <rect x="30" y="78" width="130" height="34" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="95" y="99" font-size="12" text-anchor="middle" fill="#111827">安全关键队列</text>
  <rect x="166" y="82" width="26" height="26" rx="4" fill="#dbeafe" stroke="#1f2937" stroke-width="1"/>
  <rect x="196" y="82" width="26" height="26" rx="4" fill="#dbeafe" stroke="#1f2937" stroke-width="1"/>

  <rect x="30" y="124" width="130" height="34" rx="8" fill="#ede9fe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="95" y="145" font-size="12" text-anchor="middle" fill="#111827">音视频队列</text>
  <rect x="166" y="128" width="26" height="26" rx="4" fill="#ede9fe" stroke="#1f2937" stroke-width="1"/>
  <rect x="196" y="128" width="26" height="26" rx="4" fill="#ede9fe" stroke="#1f2937" stroke-width="1"/>
  <rect x="226" y="128" width="26" height="26" rx="4" fill="#ede9fe" stroke="#1f2937" stroke-width="1"/>

  <rect x="30" y="170" width="130" height="34" rx="8" fill="#f3f4f6" stroke="#1f2937" stroke-width="1.5"/>
  <text x="95" y="191" font-size="12" text-anchor="middle" fill="#111827">尽力而为队列</text>
  <rect x="166" y="174" width="52" height="26" rx="4" fill="#f3f4f6" stroke="#1f2937" stroke-width="1"/>
  <rect x="222" y="174" width="52" height="26" rx="4" fill="#f3f4f6" stroke="#1f2937" stroke-width="1"/>

  <text x="30" y="232" font-size="11" fill="#6b7280">全网时钟同步：IEEE 802.1AS</text>

  <!-- TAS 门控时隙：两个周期 -->
  <text x="330" y="66" font-size="13" font-weight="bold" fill="#111827">时间感知调度（TAS，IEEE 802.1Qbv）：门控列表周期</text>

  <!-- 周期1 -->
  <rect x="300" y="82" width="130" height="40" rx="4" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="365" y="106" font-size="12" text-anchor="middle" fill="#111827">安全关键时隙</text>
  <rect x="430" y="82" width="24" height="40" rx="4" fill="#ffedd5" stroke="#1f2937" stroke-width="1.5"/>
  <rect x="454" y="82" width="140" height="40" rx="4" fill="#ede9fe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="524" y="106" font-size="12" text-anchor="middle" fill="#111827">音视频时隙</text>
  <rect x="594" y="82" width="24" height="40" rx="4" fill="#ffedd5" stroke="#1f2937" stroke-width="1.5"/>
  <rect x="618" y="82" width="82" height="40" rx="4" fill="#f3f4f6" stroke="#1f2937" stroke-width="1.5"/>
  <text x="659" y="106" font-size="11" text-anchor="middle" fill="#111827">尽力而为</text>

  <!-- 周期2 -->
  <rect x="700" y="82" width="24" height="40" rx="4" fill="#ffedd5" stroke="#1f2937" stroke-width="1.5"/>
  <rect x="724" y="82" width="130" height="40" rx="4" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="789" y="106" font-size="12" text-anchor="middle" fill="#111827">安全关键时隙</text>
  <rect x="854" y="82" width="24" height="40" rx="4" fill="#ffedd5" stroke="#1f2937" stroke-width="1.5"/>
  <rect x="878" y="82" width="82" height="40" rx="4" fill="#ede9fe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="919" y="106" font-size="11" text-anchor="middle" fill="#111827">音视频</text>

  <!-- 周期括号 -->
  <path d="M 300,134 L 300,142 L 700,142 L 700,134" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <text x="500" y="158" font-size="11" text-anchor="middle" fill="#374151">门控周期 N</text>
  <path d="M 724,134 L 724,142 L 960,142 L 960,134" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <text x="842" y="158" font-size="11" text-anchor="middle" fill="#374151">门控周期 N+1</text>
  <text x="442" y="78" font-size="10" text-anchor="middle" fill="#c2410c">保护带</text>

  <!-- 帧抢占波形（IEEE 802.1Qbu） -->
  <text x="300" y="200" font-size="13" font-weight="bold" fill="#111827">帧抢占时序（IEEE 802.1Qbu）：高优先级帧打断低优先级大帧</text>

  <!-- 低优先级大帧片段1 -->
  <rect x="300" y="280" width="120" height="40" rx="4" fill="#f3f4f6" stroke="#1f2937" stroke-width="1.5"/>
  <text x="360" y="304" font-size="11" text-anchor="middle" fill="#111827">低优先级大帧·片段1</text>
  <!-- 高优先级帧抢占 -->
  <rect x="420" y="260" width="110" height="60" rx="4" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="475" y="288" font-size="11" text-anchor="middle" fill="#111827">高优先级帧</text>
  <text x="475" y="306" font-size="11" text-anchor="middle" fill="#111827">（抢占发送）</text>
  <!-- 低优先级大帧续传 -->
  <rect x="530" y="280" width="180" height="40" rx="4" fill="#f3f4f6" stroke="#1f2937" stroke-width="1.5"/>
  <text x="620" y="304" font-size="11" text-anchor="middle" fill="#111827">低优先级大帧·片段2（续传）</text>

  <!-- 抢占点标注 -->
  <path d="M 420,340 L 420,360" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="424" y="376" font-size="11" fill="#374151">抢占点：低帧被打断，高帧插入后立即续传</text>

  <!-- 无抢占对照 -->
  <text x="760" y="216" font-size="11" fill="#6b7280">若无抢占：低优先级大帧将阻塞高优先级帧</text>
  <rect x="760" y="226" width="200" height="28" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="860" y="244" font-size="10" text-anchor="middle" fill="#6b7280">低帧完整发送，高帧排队等待</text>

  <!-- 时间轴 -->
  <path d="M 60,470 L 960,470" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="948" y="492" font-size="12" text-anchor="end" fill="#374151">时间 t</text>
  <path d="M 300,464 L 300,476" fill="none" stroke="#374151" stroke-width="1.5"/>
  <path d="M 500,464 L 500,476" fill="none" stroke="#374151" stroke-width="1.5"/>
  <path d="M 700,464 L 700,476" fill="none" stroke="#374151" stroke-width="1.5"/>

  <!-- 图例 -->
  <rect x="60" y="520" width="880" height="56" rx="8" fill="#f3f4f6" stroke="#1f2937" stroke-width="1.5"/>
  <rect x="80" y="538" width="18" height="18" rx="4" fill="#dbeafe" stroke="#1f2937" stroke-width="1"/>
  <text x="104" y="552" font-size="12" fill="#374151">安全关键</text>
  <rect x="190" y="538" width="18" height="18" rx="4" fill="#ede9fe" stroke="#1f2937" stroke-width="1"/>
  <text x="214" y="552" font-size="12" fill="#374151">音视频</text>
  <rect x="290" y="538" width="18" height="18" rx="4" fill="#f3f4f6" stroke="#1f2937" stroke-width="1"/>
  <text x="314" y="552" font-size="12" fill="#374151">尽力而为</text>
  <rect x="420" y="538" width="18" height="18" rx="4" fill="#ffedd5" stroke="#1f2937" stroke-width="1"/>
  <text x="444" y="552" font-size="12" fill="#374151">保护带（防低帧侵占下一时隙）</text>
  <text x="700" y="552" font-size="12" fill="#374151">802.1AS 同步 · 802.1Qbv 调度 · 802.1Qbu 抢占</text>
</svg>
