<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arrowhead-rev" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M10,0 L0,4 L10,8 Z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="960" height="460" fill="#ffffff"/>

  <text x="30" y="32" font-size="16" font-weight="bold" fill="#111827">图5-1 车规级Chiplet异构集成封装示意</text>

  <!-- 顶部封装标注 -->
  <text x="395" y="66" font-size="13" text-anchor="middle" fill="#374151">2.5D / 3D 高级封装</text>
  <path d="M 90,88 L 90,78 L 700,78 L 700,88" fill="none" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5 4"/>

  <!-- UCIe 互连标注 -->
  <text x="395" y="200" font-size="12" text-anchor="middle" fill="#374151">UCIe 3.0（最高 64 GT/s）</text>

  <!-- 芯粒间双向箭头 -->
  <path d="M 202,220 L 223,220" fill="none" stroke="#6b7280" stroke-width="1.5" marker-start="url(#arrowhead-rev)" marker-end="url(#arrowhead)"/>
  <path d="M 337,220 L 358,220" fill="none" stroke="#6b7280" stroke-width="1.5" marker-start="url(#arrowhead-rev)" marker-end="url(#arrowhead)"/>
  <path d="M 472,220 L 493,220" fill="none" stroke="#6b7280" stroke-width="1.5" marker-start="url(#arrowhead-rev)" marker-end="url(#arrowhead)"/>
  <path d="M 607,220 L 628,220" fill="none" stroke="#6b7280" stroke-width="1.5" marker-start="url(#arrowhead-rev)" marker-end="url(#arrowhead)"/>

  <!-- 芯粒 -->
  <rect x="90" y="250" width="110" height="80" rx="8" fill="#ffedd5" stroke="#1f2937" stroke-width="1.5"/>
  <text x="145" y="286" font-size="13" text-anchor="middle" fill="#111827">CPU 芯粒</text>
  <text x="145" y="308" font-size="11" text-anchor="middle" fill="#6b7280">成熟工艺</text>

  <rect x="225" y="250" width="110" height="80" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="280" y="286" font-size="13" text-anchor="middle" fill="#111827">NPU 芯粒</text>
  <text x="280" y="308" font-size="11" text-anchor="middle" fill="#6b7280">3nm 先进工艺</text>

  <rect x="360" y="250" width="110" height="80" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="415" y="286" font-size="13" text-anchor="middle" fill="#111827">NPU 芯粒</text>
  <text x="415" y="308" font-size="11" text-anchor="middle" fill="#6b7280">3nm 先进工艺</text>

  <rect x="495" y="250" width="110" height="80" rx="8" fill="#ffedd5" stroke="#1f2937" stroke-width="1.5"/>
  <text x="550" y="286" font-size="13" text-anchor="middle" fill="#111827">I/O 通信芯粒</text>
  <text x="550" y="308" font-size="11" text-anchor="middle" fill="#6b7280">SerDes / 车载以太网</text>

  <!-- HBM 堆叠 -->
  <rect x="630" y="250" width="70" height="24" rx="4" fill="#ede9fe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="665" y="266" font-size="11" text-anchor="middle" fill="#111827">HBM</text>
  <rect x="630" y="278" width="70" height="24" rx="4" fill="#ede9fe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="665" y="294" font-size="11" text-anchor="middle" fill="#111827">HBM</text>
  <rect x="630" y="306" width="70" height="24" rx="4" fill="#ede9fe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="665" y="322" font-size="11" text-anchor="middle" fill="#111827">HBM</text>
  <text x="665" y="240" font-size="11" text-anchor="middle" fill="#6b7280">内存堆叠</text>

  <!-- 微凸块 -->
  <g fill="#9ca3af">
    <circle cx="100" cy="342" r="2.5"/><circle cx="115" cy="342" r="2.5"/><circle cx="130" cy="342" r="2.5"/><circle cx="145" cy="342" r="2.5"/><circle cx="160" cy="342" r="2.5"/><circle cx="175" cy="342" r="2.5"/><circle cx="190" cy="342" r="2.5"/>
    <circle cx="235" cy="342" r="2.5"/><circle cx="250" cy="342" r="2.5"/><circle cx="265" cy="342" r="2.5"/><circle cx="280" cy="342" r="2.5"/><circle cx="295" cy="342" r="2.5"/><circle cx="310" cy="342" r="2.5"/><circle cx="325" cy="342" r="2.5"/>
    <circle cx="370" cy="342" r="2.5"/><circle cx="385" cy="342" r="2.5"/><circle cx="400" cy="342" r="2.5"/><circle cx="415" cy="342" r="2.5"/><circle cx="430" cy="342" r="2.5"/><circle cx="445" cy="342" r="2.5"/><circle cx="460" cy="342" r="2.5"/>
    <circle cx="505" cy="342" r="2.5"/><circle cx="520" cy="342" r="2.5"/><circle cx="535" cy="342" r="2.5"/><circle cx="550" cy="342" r="2.5"/><circle cx="565" cy="342" r="2.5"/><circle cx="580" cy="342" r="2.5"/><circle cx="595" cy="342" r="2.5"/>
    <circle cx="640" cy="342" r="2.5"/><circle cx="655" cy="342" r="2.5"/><circle cx="670" cy="342" r="2.5"/><circle cx="685" cy="342" r="2.5"/>
  </g>

  <!-- 封装基板 -->
  <rect x="60" y="355" width="840" height="55" rx="8" fill="#f3f4f6" stroke="#1f2937" stroke-width="1.5"/>
  <text x="480" y="388" font-size="13" text-anchor="middle" fill="#111827">封装基板（Package Substrate）</text>

  <!-- 右侧注释 -->
  <rect x="730" y="250" width="170" height="80" rx="8" fill="#ede9fe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="815" y="282" font-size="11" text-anchor="middle" fill="#6b7280">不同工艺节点混封，</text>
  <text x="815" y="304" font-size="11" text-anchor="middle" fill="#6b7280">良率与成本最优</text>

  <text x="480" y="440" font-size="11" text-anchor="middle" fill="#6b7280">▲ 芯粒与基板之间经微凸块（Micro-bumps）互连；I/O 芯粒对接 SerDes 与车载以太网</text>
</svg>
