<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="960" height="500" fill="#ffffff"/>

  <text x="30" y="32" font-size="16" font-weight="bold" fill="#111827">图4-1 物理AI数据飞轮与合成数据注入闭环</text>

  <!-- 外侧注入框 -->
  <rect x="40" y="55" width="190" height="52" rx="8" fill="#ccfbf1" stroke="#1f2937" stroke-width="1.5"/>
  <text x="135" y="76" font-size="13" text-anchor="middle" fill="#111827">仿真合成数据</text>
  <text x="135" y="96" font-size="11" text-anchor="middle" fill="#6b7280">NeRF / 3DGS 场景重建</text>

  <rect x="730" y="55" width="190" height="52" rx="8" fill="#ccfbf1" stroke="#1f2937" stroke-width="1.5"/>
  <text x="825" y="76" font-size="13" text-anchor="middle" fill="#111827">世界模型生成数据</text>
  <text x="825" y="96" font-size="11" text-anchor="middle" fill="#6b7280">Cosmos</text>

  <!-- 注入箭头（沿环外侧汇入“模型训练”） -->
  <path d="M 130,107 C 50,210 150,360 420,382" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <path d="M 830,107 C 910,210 810,360 540,382" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- 飞轮六节点 -->
  <rect x="415" y="130" width="130" height="40" rx="8" fill="#ccfbf1" stroke="#1f2937" stroke-width="1.5"/>
  <text x="480" y="155" font-size="13" text-anchor="middle" fill="#111827">真实数据采集</text>

  <rect x="545" y="187" width="170" height="40" rx="8" fill="#ede9fe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="630" y="212" font-size="13" text-anchor="middle" fill="#111827">难例挖掘（影子模式）</text>

  <rect x="575" y="303" width="110" height="40" rx="8" fill="#ccfbf1" stroke="#1f2937" stroke-width="1.5"/>
  <text x="630" y="328" font-size="13" text-anchor="middle" fill="#111827">标注 / 清洗</text>

  <rect x="425" y="360" width="110" height="40" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="480" y="385" font-size="13" text-anchor="middle" fill="#111827">模型训练</text>

  <rect x="275" y="303" width="110" height="40" rx="8" fill="#ffedd5" stroke="#1f2937" stroke-width="1.5"/>
  <text x="330" y="328" font-size="13" text-anchor="middle" fill="#111827">端侧部署</text>

  <rect x="290" y="187" width="80" height="40" rx="8" fill="#ccfbf1" stroke="#1f2937" stroke-width="1.5"/>
  <text x="330" y="212" font-size="13" text-anchor="middle" fill="#111827">回传</text>

  <!-- 飞轮弧线箭头（顺时针） -->
  <path d="M 547,156 C 585,163 610,171 622,183" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <path d="M 717,225 C 730,258 724,285 690,302" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <path d="M 612,345 C 585,357 558,364 540,368" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <path d="M 420,368 C 402,364 375,357 348,345" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <path d="M 273,315 C 235,290 233,240 285,218" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <path d="M 345,185 C 365,168 390,158 412,154" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <text x="480" y="262" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">数据飞轮</text>
  <text x="480" y="284" font-size="11" text-anchor="middle" fill="#6b7280">Data Flywheel</text>

  <text x="480" y="460" font-size="11" text-anchor="middle" fill="#6b7280">Real2Sim2Real：真实失败案例回灌仿真校准，提升长尾场景覆盖</text>
